        <h1>AiMapping — Relevamiento de infraestructura con IA</h1>
        <p><strong>Transforma imágenes del relevamiento en activos de infraestructura identificados y georreferenciados con IA, listos para usar en GIS y CAD.</strong></p>
        <section>
          <h2>Solución Geoespacial B2B & Relevamiento Inteligente</h2>
          <p>AiMapping es una plataforma tecnológica que procesa registros visuales capturados con cámaras de alta resolución en vehículos para detectar, clasificar y georreferenciar activos de infraestructura urbana, telecomunicaciones, energía y redes viales de manera automatizada.</p>
        </section>
        <section>
          <h2>Flujo de Trabajo</h2>
          <ol>
            <li><strong>01 Captura:</strong> Recorridos continuos en vía pública registrando video e imágenes de alta definición.</li>
            <li><strong>02 Detección con IA:</strong> Algoritmos de visión computacional para clasificar postes, luminarias, cámaras, semáforos, cables y señalética.</li>
            <li><strong>03 Georreferenciación precisa:</strong> Coordenadas espaciales exactas y atributos técnicos asignados a cada elemento.</li>
            <li><strong>04 Entregables listos para usar:</strong> Capas GIS (Shapefile, GeoJSON), bases de datos tabulares (CSV/Excel) y planos CAD (DXF, DWG).</li>
          </ol>
        </section>
        <section>

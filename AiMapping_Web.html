    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://aimapping.net/#organization",
          "name": "AiMapping",
          "url": "https://aimapping.net/",
          "logo": "https://aimapping.net/logo.png",
          "description": "Solución geoespacial y relevamiento inteligente de activos con inteligencia artificial.",
          "email": "ventas@aimapping.net",
          "telephone": "+5491162822541",
          "areaServed": "Latin America",
          "sameAs": [
            "https://www.linkedin.com/company/aimapping-url/about/"
          ]
        },
        {
          "@type": "Service",
          "@id": "https://aimapping.net/#service",
          "name": "Relevamiento Geoespacial Inteligente B2B",
          "provider": {
            "@id": "https://aimapping.net/#organization"
          },
          "serviceType": "Relevamiento de Infraestructura y GIS con IA",
          "description": "Transformamos imágenes de recorridos en activos identificados, clasificados y georreferenciados en formatos compatibles con GIS y CAD.",
          "category": "Geospatial Services"
        },
        {
          "@type": "FAQPage",
          "@id": "https://aimapping.net/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "¿Qué activos puede identificar AiMapping?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Los que se definan antes del relevamiento y sean visibles en las imágenes: postes, luminarias, cámaras, semáforos, paradas y otros activos acordados."
              }
            },
            {
              "@type": "Question",
              "name": "¿Quién realiza el recorrido?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El cliente adquiere el kit de cámaras y realiza el recorrido para capturar las imágenes."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué hace AiMapping con las imágenes?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AiMapping procesa el material recibido para detectar, clasificar y georreferenciar los activos definidos para cada proyecto."
              }
            },
            {
              "@type": "Question",
              "name": "¿En qué formatos se entrega la información?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Según las necesidades del proyecto, la entrega puede realizarse en DXF, DWG, GIS, imágenes, grabaciones u otros formatos acordados."
              }
            },
            {
              "@type": "Question",
              "name": "¿Se adapta a diferentes proyectos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Si, Greenfield, Brownfield, Mantenimiento, CAOs, Detección de fallas, QC, etc. Se define qué activos identificar, qué atributos relevar y qué formato de entrega necesita cada caso."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cómo comienza un proyecto?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El primer paso es una conversación para entender la necesidad. A partir de ahí, AiMapping puede mostrar una demo general y evaluar el alcance del proyecto."
              }
            }
          ]
        }
      ]
    }
